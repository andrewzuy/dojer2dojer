# p2p-tunnel configuration

# STUN servers to try, in order.
stun_servers = [
    "stun.l.google.com:19302",
    "stun1.l.google.com:19302",
    "stun.cloudflare.com:3478",
]

# This machine's role: "client" or "server". Optional — when absent, the role
# is selected interactively at startup (the `--role` CLI flag wins over this
# key). The two sides must disagree on nothing: both sides must pick opposite
# roles for the same tunnel.
# role = "client"

# Milliseconds between outbound hole-punch packets.
punch_interval_ms = 500

# Seconds to keep trying to hole-punch before giving up.
punch_timeout_secs = 30

# Seconds between QUIC keep-alive PING packets, sent while the tunnel is
# idle so NAT port mappings don't expire and drop the connection. 0 = off.
keep_alive_interval_secs = 5

# Client role: local TCP port to listen on, forwarding through the tunnel.
# Uncomment on the machine that exposes a local service port.
# local_tcp_listen_port = 12345

# Server role: where to forward incoming tunneled TCP traffic.
# Uncomment on the machine that holds the target service.
# remote_target_addr = "192.168.1.50:22"

#[telegram]
#token = "123456:ABC-DEF…"    # THIS machine's bot token
#peer_bot_id = 987654321      # the PEER bot's numeric id
#secret = "shared-secret"      # the shared secret for the readiness handshake
#timeout_secs = 120            # optional; default 120
